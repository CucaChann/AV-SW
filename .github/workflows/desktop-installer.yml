name: Desktop installer

# Builds the AV-SW Windows installers (.msi and setup .exe).
# - Every push to main: installers are attached to the workflow run as a download.
# - Tags like v0.3.0: installers are also attached to a draft GitHub release.
# - Pull requests that touch the desktop shell or dependencies: build only, to catch breakage.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-installer.yml"
  workflow_dispatch:

concurrency:
  group: desktop-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write # only used to create the draft release on version tags
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build installers
        run: npx tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: AV-SW-windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Attach installers to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
